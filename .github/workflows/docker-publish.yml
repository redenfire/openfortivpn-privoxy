name: Build & Push to GHCR

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * *'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Base image: the plain env-driven version.
          - variant: base
            tag: latest
            entrypoint: start.sh
          # Certificate variant: downloads the gateway certificate and pins
          # its SHA-256 automatically.
          - variant: vpn_cert
            tag: vpn_cert
            entrypoint: entrypoint.sh

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          push: true
          build-args: |
            VPN_ENTRYPOINT=${{ matrix.entrypoint }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.tag }}
