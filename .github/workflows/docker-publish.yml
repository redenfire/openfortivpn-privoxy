name: Build & Push to GHCR

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * *'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Tag pubblicati a ogni build:
  #   - cert            (tag "mobile" della nuova versione)
  #   - cert-2026.11    (tag di versione)
  # "latest" NON viene più aggiornato: resta fermo sull'immagine precedente
  # alla modifica certificati, così è possibile fare rollback.
  # Nota: entrambi i tag sono mutabili e vengono spostati a ogni build.
  # Per un riferimento immutabile usa il digest sha256.
  IMAGE_TAG: cert
  IMAGE_VERSION_TAG: cert-2026.11

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          push: true
          # "latest" è volutamente escluso per non sovrascrivere la versione
          # precedente e mantenerla disponibile per il rollback.
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_VERSION_TAG }}